plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

// Release 签名配置写在项目根目录 keystore.properties（不进版本库）
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
android {
    namespace 'com.example.localbuddy'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.localbuddy"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // OpenCV native .so 体积大，仅保留 arm64-v8a（主流 64 位 ARM）以控体积
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Release 签名：密钥信息与口令放在项目根目录 keystore.properties（不进版本库）
    // 该文件不存在时（例如只有 debug 环境），release 按未签名方式构建，不会中断。
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                // 路径按项目根目录解析（否则会被当成 app/ 模块的相对路径）
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }

    // 纯数学模块（AudioEnhancer 等）的 JVM 单测需要 android.util.Log 的默认值
    testOptions {
        unitTests.returnDefaultValues = true
    }

    // 模型资产压缩打包：tts 加入后 assets 总量（~4.1GiB）超 Zip32 APK 4GB 硬上限，必须压缩
    // 存储（TTS LLM 为 float32 权重，实测可压至 ~42%）。所有引擎均先经 assets.open() 流式
    // 解包到 filesDir 再加载，压缩不影响运行时；代价是首次解包稍慢，且 openFd 的缓存完整性
    // 校验对压缩资产回退为存在性检查（与 OCR 一致）。json 保持不压缩（体积小、读取频繁）。
    aaptOptions {
        noCompress 'json'
    }

    // OpenCV 与 PyTorch Android Lite 各自带 libc++_shared.so（NDK 标准 C++ 运行时，内容一致），
    // AGP 不会自动二选一，需显式 pickFirst 消除冲突。
    packaging {
        jniLibs {
            pickFirsts += 'lib/**/libc++_shared.so'
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    // MT(Hunyuan-MT) int8 用标准 MatMulInteger 等算子；历史 int4 曾用 com.microsoft.GatherBlockQuantized（需 ≥1.17）。1.26.0 兼容。
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.26.0'
    // 全能扫描智能体：OpenCV 文档扫描（边缘检测+透视矫正）+ CameraX 拍照
    implementation 'org.opencv:opencv:4.9.0'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation("androidx.navigation:navigation-compose:2.7.7")

    // 如果还没有这些 Compose 依赖，确保添加
    implementation(platform("androidx.compose:compose-bom:2024.02.00"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("org.pytorch:pytorch_android_lite:2.1.0")
    implementation("org.pytorch:pytorch_android_torchvision_lite:2.1.0")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2")
    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.6.2")
    implementation("com.jakewharton.timber:timber:5.0.1")
    implementation libs.androidx.compose.foundation.layout
    // 翻译模式：PDF 直接抽取文本（不做 OCR）
    implementation("com.tom-roush:pdfbox-android:2.0.27.0")
    // Apache POI：docx 解析（与 pdfbox 并列，同为文档解析层）
    implementation("org.apache.poi:poi-ooxml:5.2.3") {
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
    }

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}